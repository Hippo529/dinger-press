# Test, build and deploy DINGER PRESS to GitHub Pages (project site under /dinger-press/).
# The build uses Vite `base: './'`, so every asset, the manifest and its start_url/scope are relative
# and work under any subpath. There is no service worker.
name: Test and deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The Playwright verify suite needs a local browser and is run in development, not in CI.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit + bot tests
        run: npm test
      - name: Typecheck + structure rules
        run: npm run check
      - name: Build (dist/, relative base)
        run: npm run build
      - name: Build audit
        run: npm run audit
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
